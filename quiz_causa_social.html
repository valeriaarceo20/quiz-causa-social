<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cuál es tu causa? Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #7A1FA6 0%, #5B0E8B 55%, #3F0A66 100%);
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; width: 100%; position: relative; padding: 1rem 0 2rem; }

  #heartBg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0.20; pointer-events: none; z-index: 0; }
  #pulseHeart { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes hueshift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

  .card {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 1.75rem 1.5rem;
    box-shadow: 0 18px 40px rgba(59, 10, 102, 0.45);
    position: relative;
    z-index: 1;
  }

  .cover { text-align: center; padding: 0.5rem 0.25rem; }
  .cover-badge {
    display: inline-block;
    background: linear-gradient(135deg, #F9A826, #F26D6D);
    color: #3F0A66;
    font-weight: 800;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 14px;
    letter-spacing: 0.04em;
    transform: rotate(-3deg);
  }
  .cover-title { font-size: 28px; font-weight: 800; color: #3F0A66; margin: 0 0 8px; line-height: 1.15; }
  .cover-sub { font-size: 14px; color: #7A1FA6; margin: 0 0 4px; font-weight: 500; }
  .cover-by { font-size: 12px; color: #B27ED9; margin: 0 0 1.75rem; font-style: italic; }
  .startbtn {
    padding: 14px 40px;
    border-radius: 99px;
    border: none;
    background: linear-gradient(135deg, #B026FF, #7A1FA6);
    color: #FFFFFF;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(122, 31, 166, 0.45);
    transition: transform .15s;
  }
  .startbtn:hover { transform: translateY(-2px) scale(1.03); }
  .startbtn:active { transform: scale(0.97); }

  .track-wrap { position: relative; height: 46px; margin-bottom: 1.25rem; }
  .track-line { position: absolute; top: 30px; left: 0; right: 0; height: 5px; background: #F0E4FA; border-radius: 99px; }
  .track-fill { position: absolute; top: 30px; left: 0; height: 5px; background: linear-gradient(90deg, #F9A826, #B026FF); border-radius: 99px; width: 0%; transition: width .35s ease; }
  #catWalk { position: absolute; top: -4px; left: 0%; transform: translateX(-50%); transition: left .35s ease; font-size: 26px; }
  #catWalk.stepping { animation: catbob .3s ease; }
  @keyframes catbob { 0%,100% { transform: translateX(-50%) translateY(0) scaleX(1); } 50% { transform: translateX(-50%) translateY(-6px) scaleX(-1); } }

  .qtitle-label { font-size: 11px; letter-spacing: 0.08em; color: #B026FF; margin: 0 0 6px; text-transform: uppercase; font-weight: 700; }
  .qtext { font-size: 18px; font-weight: 700; color: #3F0A66; margin: 0 0 1.1rem; }
  .optbtn {
    text-align: left;
    padding: 13px 18px;
    border-radius: 14px;
    border: 2px solid #EEDCFA;
    background: #FBF6FE;
    color: #5B0E8B;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
    transition: background .15s, transform .1s, border-color .15s;
  }
  .optbtn:hover { background: #F3E4FC; border-color: #D9A6F0; transform: translateX(2px); }
  .optbtn:active { transform: scale(0.98); }

  .result-emoji { font-size: 54px; display: block; margin-bottom: 6px; }
  .result-label { font-size: 13px; color: #B026FF; margin: 2px 0 4px; font-weight: 600; }
  .resultcard {
    background: linear-gradient(135deg, #FBF6FE, #F3E4FC);
    border-radius: 16px;
    border: 2px solid #EEDCFA;
    padding: 1.1rem 1.25rem;
  }
  .resulttable { width: 100%; border-collapse: collapse; font-size: 14px; }
  .resulttable td { padding: 8px 4px; }
  .resulttable tr:first-child td { border-bottom: 1px solid #E4CBF5; }
  .restartbtn {
    padding: 10px 24px;
    border-radius: 99px;
    border: 2px solid #B026FF;
    background: #FFFFFF;
    color: #7A1FA6;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .restartbtn:hover { background: #FBF6FE; }

  .confetti-piece { position: fixed; top: -30px; font-size: 22px; pointer-events: none; z-index: 999; animation: confettifall linear forwards; }
  @keyframes confettifall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div id="heartBg">
    <svg id="pulseHeart" width="260" height="260" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="iri" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F9A826"/>
          <stop offset="35%" stop-color="#F26D6D"/>
          <stop offset="65%" stop-color="#B026FF"/>
          <stop offset="100%" stop-color="#5DCAA5"/>
        </linearGradient>
      </defs>
      <path d="M50 88 C20 65 5 45 5 28 C5 12 18 3 32 3 C42 3 48 10 50 16 C52 10 58 3 68 3 C82 3 95 12 95 28 C95 45 80 65 50 88 Z" fill="url(#iri)" style="animation: hueshift 3s linear infinite;"/>
    </svg>
  </div>

  <div class="card">

    <div id="coverScreen" class="cover">
      <span class="cover-badge">quiz express</span>
      <p class="cover-title">¿Cuál es tu causa? 💜</p>
      <p class="cover-sub">Pop, vibes y liderazgo social</p>
      <p class="cover-by">by Valeria Arceo</p>
      <button class="startbtn" onclick="startQuiz()">Iniciar ✨</button>
    </div>

    <div id="quizScreen" style="display:none;">
      <div class="track-wrap">
        <div class="track-line"></div>
        <div class="track-fill" id="progressFill"></div>
        <div id="catWalk">🐱</div>
      </div>
      <div id="quizArea"></div>
    </div>

  </div>
</div>

<script>
const questions = [
  { text: "Ves un problema en tu comunidad. ¿Qué haces primero?", type: "score",
    opts: [
      {t:"Actúo de inmediato ⚡", p:"accion"},
      {t:"Organizo a otros 📣", p:"lider"},
      {t:"Investigo antes de moverme 🔎", p:"voz"},
      {t:"Busco a quién ya está en eso 🤝", p:"alma"}
    ]},
  { text: "En un proyecto en equipo, tu rol natural es...", type: "score",
    opts: [
      {t:"Organizar y repartir tareas 📋", p:"lider"},
      {t:"Ejecutar y resolver ya 🛠️", p:"accion"},
      {t:"Cuidar que todos estén bien 💗", p:"alma"},
      {t:"Pensar la estrategia 🧠", p:"voz"}
    ]},
  { text: "¿Eres más de Britney o de Christina Aguilera?", type: "vibe",
    opts: [{t:"Britney 🎤"},{t:"Christina 🎶"}] },
  { text: "Algo te indigna. ¿Qué te nace hacer?", type: "score",
    opts: [
      {t:"Hablarlo y movilizar gente 📢", p:"lider"},
      {t:"Resolverlo con mis manos ya 🙌", p:"accion"},
      {t:"Informarme a fondo primero 📚", p:"voz"},
      {t:"Ayudar desde lo emocional 🫶", p:"alma"}
    ]},
  { text: "¿Qué te da más satisfacción?", type: "score",
    opts: [
      {t:"Resultados inmediatos 🚀", p:"accion"},
      {t:"Ver un grupo organizado por mí 👯", p:"lider"},
      {t:"Que alguien se sintió acompañado 🥹", p:"alma"},
      {t:"Haber enseñado algo importante 💡", p:"voz"}
    ]},
  { text: "¿Eres más de pop o de rock?", type: "vibe",
    opts: [{t:"Pop 🌸"},{t:"Rock 🤘"}] },
  { text: "Si eligieras una misión, ¿cuál sería?", type: "score",
    opts: [
      {t:"Movilizar gente 📣", p:"lider"},
      {t:"Acción directa urgente ⚡", p:"accion"},
      {t:"Acompañar a quien lo necesita 💜", p:"alma"},
      {t:"Educar y generar conciencia 🌱", p:"voz"}
    ]}
];

const profiles = {
  lider: { causa: "Liderazgo juvenil e incidencia cívica", vibe: "Organizas y convocas", emoji:"📣",
    ejemplos: ["🏛️ Consejos juveniles municipales o estatales", "🎓 Colectivos estudiantiles y de representación", "🤝 ONGs de incidencia y derechos humanos"] },
  accion: { causa: "Brigadas y voluntariado operativo", vibe: "Actúas ya, resuelves en el momento", emoji:"⚡",
    ejemplos: ["🚨 Brigadas de protección civil o rescate", "🌊 Jornadas de limpieza y reforestación", "🏥 Voluntariado en bancos de alimentos o de sangre"] },
  alma: { causa: "Apoyo a niñez, adultos mayores y salud emocional comunitaria", vibe: "Empatía y acompañamiento", emoji:"💜",
    ejemplos: ["🧒 Casas hogar o albergues para niñez", "👵 Asilos y centros de día para adultos mayores", "🫂 Líneas de acompañamiento y salud mental"] },
  voz: { causa: "Educación, medio ambiente y derechos humanos", vibe: "Investigas, enseñas, generas conciencia", emoji:"🌱",
    ejemplos: ["📖 Programas de tutorías o alfabetización", "🌎 Colectivos ambientales y de sostenibilidad", "⚖️ Organizaciones de derechos humanos y divulgación"] }
};

let current = 0;
const scores = { lider:0, accion:0, alma:0, voz:0 };
const area = document.getElementById('quizArea');
const fill = document.getElementById('progressFill');
const cat = document.getElementById('catWalk');
const heartBg = document.getElementById('heartBg');

function startQuiz() {
  document.getElementById('coverScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  render();
}

function updateTrack() {
  const pct = Math.round((current / questions.length) * 100);
  fill.style.width = pct + "%";
  cat.style.left = pct + "%";
  cat.classList.add('stepping');
  setTimeout(() => cat.classList.remove('stepping'), 300);
}

function render() {
  updateTrack();
  if (current >= questions.length) { renderResult(); return; }
  const q = questions[current];
  let html = '<p class="qtitle-label">Pregunta ' + (current + 1) + ' de ' + questions.length + '</p>';
  html += '<p class="qtext">' + q.text + '</p><div>';
  q.opts.forEach((o, i) => {
    html += '<button class="optbtn" onclick="answer(' + i + ')">' + o.t + '</button>';
  });
  html += '</div>';
  area.innerHTML = html;
}

function answer(i) {
  const q = questions[current];
  if (q.type === "score") { scores[q.opts[i].p] += 1; }
  current += 1;
  render();
}

function emojiConfetti() {
  const bits = ['🎉','✨','💜','🌸','⭐','🎊'];
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('span');
    el.className = 'confetti-piece';
    el.textContent = bits[Math.floor(Math.random() * bits.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    el.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function renderResult() {
  let top = "lider";
  Object.keys(scores).forEach(k => { if (scores[k] > scores[top]) top = k; });
  const r = profiles[top];
  heartBg.style.display = 'none';
  fill.style.width = "100%";
  cat.style.left = "100%";
  area.innerHTML =
    '<div style="text-align:center;padding:0.25rem 0 0.5rem;">' +
    '<span class="result-emoji">' + r.emoji + '</span>' +
    '<p class="result-label">Tu match es</p></div>' +
    '<div class="resultcard"><table class="resulttable">' +
    '<tr><td style="color:#B026FF;width:40%;font-weight:600;">Causa/proyecto</td><td style="font-weight:600;color:#3F0A66;">' + r.causa + '</td></tr>' +
    '<tr><td style="color:#B026FF;font-weight:600;">Vibe</td><td style="color:#5B0E8B;">' + r.vibe + '</td></tr>' +
    '</table></div>' +
    '<div style="margin-top:1rem;">' +
    '<p style="font-size:12px;color:#B026FF;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 8px;">Dónde puedes involucrarte</p>' +
    '<div style="display:flex;flex-direction:column;gap:8px;">' +
    r.ejemplos.map(function(e) {
      return '<div style="background:#FBF6FE;border:2px solid #EEDCFA;border-radius:12px;padding:10px 14px;font-size:13px;color:#5B0E8B;font-weight:500;">' + e + '</div>';
    }).join('') +
    '</div></div>' +
    '<div style="text-align:center;margin-top:1.1rem;"><button class="restartbtn" onclick="restart()">Repetir quiz 🔁</button></div>';
  emojiConfetti();
}

function restart() {
  current = 0;
  scores.lider = 0; scores.accion = 0; scores.alma = 0; scores.voz = 0;
  heartBg.style.display = 'flex';
  render();
}
</script>

</body>
</html>
